<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I3O Teste</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;background:#f8fafc;color:#0f172a}
  .box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:16px}
  input,button{padding:10px 12px;border-radius:8px;border:1px solid #cbd5e1;font:inherit}
  button{background:#2563eb;color:#fff;border:0;cursor:pointer;font-weight:600}
  #status{font-size:.9rem;margin-bottom:14px;padding:10px;border-radius:8px;background:#e2e8f0}
</style>
</head>
<body>
  <h2>STOCK I3O — Teste do Zero</h2>
  <div id="status">A ligar...</div>

  <form class="box" id="formAdd">
    <input id="nome" placeholder="Nome do artigo de teste" required style="width:65%">
    <input id="stock" type="number" value="1" min="0" style="width:14%">
    <button type="submit">Gravar</button>
  </form>

  <div class="box" id="lista">Sem dados.</div>

<script>
const SCRIPT_URL = 'COLE_AQUI_O_SEU_URL_EXEC';
const $ = id => document.getElementById(id);
const setStatus = txt => { $('status').textContent = txt; };

async function parseJson(res) {
  const raw = await res.text();
  try {
    return JSON.parse(raw);
  } catch {
    throw new Error('Não devolveu JSON: ' + raw.slice(0, 160));
  }
}

async function carregar() {
  setStatus('A carregar...');
  try {
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now(), { method: 'GET', redirect: 'follow' });
    const json = await parseJson(res);
    if (!json.ok) throw new Error(json.error || 'Erro no GET');
    const items = json.data.stock || [];
    $('lista').innerHTML = items.length
      ? items.map(i => `<div>• <b>${i.Nome}</b> — Stock: ${i.Stock}</div>`).join('')
      : 'Sem artigos na folha Stock.';
    setStatus(`Ligado (${items.length} artigos).`);
  } catch (err) {
    setStatus('Erro ao carregar: ' + err.message);
  }
}

$('formAdd').addEventListener('submit', async e => {
  e.preventDefault();
  setStatus('A gravar...');
  try {
    const payload = { nome: $('nome').value.trim(), stock: Number($('stock').value || 0) };
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      redirect: 'follow',
      body: JSON.stringify({ action: 'addItem', ...payload })
    });
    const json = await parseJson(res);
    if (!json.ok) throw new Error(json.error || 'Erro no POST');
    $('nome').value = '';
    carregar();
  } catch (err) {
    setStatus('Erro ao gravar: ' + err.message);
  }
});

carregar();
</script>
</body>
</html>
