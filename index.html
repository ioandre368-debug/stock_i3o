<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I3O | Gestão de Stock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --navy:#0f172a;
  --blue:#2563eb;
  --bg:#f8fafc;
  --muted:#64748b;
  --line:#e2e8f0;
  --green:#15803d;
  --red:#b91c1c;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--navy);
  font-family:'Plus Jakarta Sans',sans-serif;
}

header{
  background:var(--navy);
  color:white;
  padding:16px max(16px,calc((100% - 1150px)/2));
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:5;
  flex-wrap:wrap;
}

.brand{
  font-weight:800;
  font-size:1.15rem;
  display:flex;
  gap:10px;
  align-items:center;
}

.brand i{
  background:var(--blue);
  padding:10px;
  border-radius:10px;
}

.header-actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

main{
  max-width:1150px;
  margin:auto;
  padding:22px 16px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:18px;
}

.tab,.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font:600 .88rem 'Plus Jakarta Sans',sans-serif;
  cursor:pointer;
  white-space:nowrap;
}

.tab{
  background:white;
  border:1px solid var(--line);
  color:var(--muted);
}

.tab.active,.btn.primary{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.btn{
  background:white;
  border:1px solid var(--line);
  color:var(--navy);
}

.btn.danger{color:var(--red)}
.btn:disabled{opacity:.55;cursor:wait}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.toolbar input,.toolbar select{
  flex:1;
  min-width:180px;
}

input,select,textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  font:inherit;
  background:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:12px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  box-shadow:0 3px 14px #0f172a0a;
}

.card h3{
  margin:0 0 5px;
  font-size:1rem;
}

.muted{
  color:var(--muted);
  font-size:.82rem;
}

.qty{
  display:grid;
  grid-template-columns:60px 1fr 90px;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.qty input{
  padding:7px;
  text-align:center;
  font-weight:700;
}

.pill{
  display:inline-block;
  border-radius:20px;
  padding:4px 9px;
  font-size:.72rem;
  font-weight:700;
  background:#dbeafe;
  color:#1d4ed8;
}

.pill.warn{
  background:#ffedd5;
  color:#9a3412;
}

.pill.ok{
  background:#dcfce7;
  color:#166534;
}

.pill.gray{
  background:#e2e8f0;
  color:#475569;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:12px;
  overflow:hidden;
}

th,td{
  text-align:left;
  padding:11px;
  border-bottom:1px solid var(--line);
  font-size:.82rem;
}

th{
  background:#f1f5f9;
  color:#475569;
}

.table-wrap{
  overflow:auto;
}

.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
  background:white;
  border-radius:14px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0f172a99;
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal.show{display:flex}

.modal-box{
  background:white;
  width:min(560px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:17px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.modal-head h2{
  font-size:1.1rem;
  margin:0;
}

.field{margin-bottom:12px}

.field label{
  display:block;
  font-size:.76rem;
  font-weight:700;
  color:var(--muted);
  margin-bottom:5px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

#status{
  font-size:.82rem;
  color:var(--muted);
  margin:8px 0;
  padding:10px 12px;
  background:white;
  border:1px solid var(--line);
  border-radius:9px;
  overflow-wrap:anywhere;
}

.hidden{display:none!important}

.pending{
  font-size:.75rem;
  color:#fed7aa;
  font-weight:700;
  white-space:nowrap;
}

@media(max-width:600px){
  header{padding:14px 16px}
  main{padding:16px 12px}
  .tab{padding:10px 12px}
  .header-actions{width:100%}
  .header-actions .btn{flex:1}
  th,td{padding:9px}
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <i class="fa-solid fa-layer-group"></i>
    STOCK I3O
  </div>

  <div class="header-actions">
    <span class="pending" id="pendingBadge">
      0 alterações pendentes
    </span>

    <button class="btn primary" id="syncButton" onclick="syncNow()">
      <i class="fa-solid fa-rotate"></i>
      Sincronizar agora
    </button>

    <button class="btn" onclick="openModal('item')">
      <i class="fa fa-plus"></i>
      Novo artigo
    </button>
  </div>
</header>

<main>

  <nav class="tabs">
    <button class="tab active" data-tab="stock" onclick="showTab('stock')">
      <i class="fa fa-boxes-stacked"></i> Stock
    </button>

    <button class="tab" data-tab="reservados" onclick="showTab('reservados')">
      <i class="fa fa-bookmark"></i> Reservas
    </button>

    <button class="tab" data-tab="clientes" onclick="showTab('clientes')">
      <i class="fa fa-users"></i> Clientes
    </button>

    <button class="tab" data-tab="historico" onclick="showTab('historico')">
      <i class="fa fa-clock-rotate-left"></i> Histórico
    </button>
  </nav>

  <div id="status">A carregar aplicação...</div>

  <!-- STOCK -->

  <section id="view-stock">

    <div class="toolbar">
      <input
        id="stockSearch"
        placeholder="Pesquisar artigo, marca ou modelo..."
        oninput="renderStock()"
      >

      <select id="stockCategory" onchange="renderStock()">
        <option value="">Todas as categorias</option>
      </select>

      <button class="btn" onclick="loadFromServer()">
        ↻ Atualizar dados
      </button>
    </div>

    <div id="stockList" class="grid"></div>

  </section>

  <!-- RESERVAS -->

  <section id="view-reservados" class="hidden">

    <div class="toolbar">

      <input
        id="reservationSearch"
        placeholder="Pesquisar reserva, cliente ou artigo..."
        oninput="renderReservations()"
      >

      <select id="reservationState" onchange="renderReservations()">
        <option value="">Todos os estados</option>
        <option>Pendente</option>
        <option>Entregue</option>
        <option>Cancelada</option>
      </select>

      <button class="btn primary" onclick="openModal('reservation')">
        + Nova reserva
      </button>

    </div>

    <div id="reservationList"></div>

  </section>

  <!-- CLIENTES -->

  <section id="view-clientes" class="hidden">

    <div class="toolbar">

      <input
        id="clientSearch"
        placeholder="Pesquisar cliente..."
        oninput="renderClients()"
      >

      <button class="btn primary" onclick="openModal('client')">
        + Novo cliente
      </button>

    </div>

    <div id="clientList" class="grid"></div>

  </section>

  <!-- HISTÓRICO -->

  <section id="view-historico" class="hidden">
    <div id="historyList"></div>
  </section>

</main>

<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="modalTitle">Novo registo</h2>

      <button class="btn" type="button" onclick="closeModal()">
        ✕
      </button>
    </div>

    <form id="modalForm" onsubmit="submitModal(event)">

      <div id="modalFields"></div>

      <button
        class="btn primary"
        style="width:100%;margin-top:8px"
        type="submit"
        id="saveButton"
      >
        Guardar
      </button>

    </form>

  </div>

</div>

<script>

/* =================================
   CONFIGURAÇÃO
================================= */

const SCRIPT_URL ='https://script.google.com/macros/s/AKfycbynXQerj7yZ5-36fR21JMHh5BqI-poqWUO3lHl0NBdyTDUM_3CjH2bMuBmT4WR8HwgP/exec';

const STORAGE_KEY = 'i3o_stock_local_v3';

let db = {
  stock: [],
  clientes: [],
  reservados: [],
  historico: []
};

let pending = [];
let modalMode = '';
let busy = false;

const $ = id => document.getElementById(id);


/* =================================
   FUNÇÕES GERAIS
================================= */

function msg(text){
  $('status').textContent = text;
}

function makeId(){
  return (crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'i3o-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g, function(char){
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[char];
  });
}

function isActive(value){
  const s = String(value ?? '').trim().toLowerCase();

  return value !== false &&
    s !== 'false' &&
    s !== 'não' &&
    s !== 'nao' &&
    s !== 'arquivado';
}

function fmtDate(value){
  if(!value) return '—';

  const d = new Date(value);

  return isNaN(d)
    ? esc(value)
    : d.toLocaleDateString('pt-PT');
}


/* =================================
   ARMAZENAMENTO LOCAL
================================= */

function saveLocal(){
  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        db: db,
        pending: pending
      })
    );
  }catch(e){
    msg('Erro ao guardar localmente: ' + e.message);
  }

  updateBadge();
}

function loadLocal(){
  try{
    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || 'null'
    );

    if(saved && saved.db){
      db = saved.db;
      pending = Array.isArray(saved.pending)
        ? saved.pending
        : [];
    }
  }catch(e){}

  renderAll();
  updateBadge();
}

function updateBadge(){
  const n = pending.length;

  $('pendingBadge').textContent =
    n + (n === 1
      ? ' alteração pendente'
      : ' alterações pendentes'
    );

  $('syncButton').disabled = busy;

  $('syncButton').innerHTML = busy
    ? '<i class="fa fa-spinner fa-spin"></i> A sincronizar...'
    : '<i class="fa-solid fa-rotate"></i> Sincronizar agora';
}


/* =================================
   NAVEGAÇÃO
================================= */

function showTab(tab){

  document.querySelectorAll('.tab').forEach(function(button){
    button.classList.toggle(
      'active',
      button.dataset.tab === tab
    );
  });

  ['stock','reservados','clientes','historico'].forEach(function(name){
    $('view-' + name).classList.toggle(
      'hidden',
      name !== tab
    );
  });

}


/* =================================
   RENDERIZAÇÃO
================================= */

function renderAll(){
  fillCategories();
  renderStock();
  renderReservations();
  renderClients();
  renderHistory();
  updateBadge();
}

function fillCategories(){

  const old = $('stockCategory').value;

  const categories = [
    ...new Set(
      db.stock
        .filter(x => isActive(x.Ativo))
        .map(x => x.Categoria)
        .filter(Boolean)
    )
  ].sort();

  $('stockCategory').innerHTML =
    '<option value="">Todas as categorias</option>' +
    categories.map(function(x){
      return `<option value="${esc(x)}">${esc(x)}</option>`;
    }).join('');

  $('stockCategory').value =
    categories.includes(old) ? old : '';
}


/* =================================
   STOCK
================================= */

function renderStock(){

  const q = $('stockSearch').value.toLowerCase();
  const cat = $('stockCategory').value;

  const list = db.stock.filter(function(x){

    return isActive(x.Ativo) &&
      (!cat || x.Categoria === cat) &&
      [x.Nome,x.Categoria,x.Tipo]
        .join(' ')
        .toLowerCase()
        .includes(q);

  });

  $('stockList').innerHTML = list.length
    ? list.map(function(x){

      return `
      <article class="card">

        <h3>${esc(x.Nome)}</h3>

        <div class="muted">
          ${esc(x.Categoria || 'Outros')}
          ·
          ${esc(x.Tipo || 'Equipamento')}
        </div>

        <div class="qty">
          <span class="muted">Stock</span>

          <input
            type="number"
            min="0"
            step="1"
            value="${Number(x.Stock) || 0}"
            id="stock-${esc(x.ID)}"
            onchange="setQty('${esc(x.ID)}','stock',this.value)"
          >

          <span class="muted">unidades</span>
        </div>

        <div class="qty">
          <span class="muted">Demo</span>

          <input
            type="number"
            min="0"
            step="1"
            value="${Number(x.Demo) || 0}"
            id="demo-${esc(x.ID)}"
            onchange="setQty('${esc(x.ID)}','demo',this.value)"
          >

          <span class="muted">unidades</span>
        </div>

        <div class="actions">

          <button
            class="btn"
            onclick="reserveThis('${esc(x.ID)}')"
          >
            Reservar
          </button>

          <button
            class="btn danger"
            onclick="archiveItem('${esc(x.ID)}')"
          >
            Arquivar
          </button>

        </div>

      </article>
      `;

    }).join('')
    : '<div class="empty">Não foram encontrados artigos.</div>';

}


/* =================================
   RESERVAS
================================= */

function renderReservations(){

  const q = $('reservationSearch').value.toLowerCase();
  const state = $('reservationState').value;

  const rows = db.reservados
    .filter(function(x){

      return (!state || x.Estado === state) &&
        [
          x.ClienteNome,
          x.ItemNome,
          x.ID,
          x.Destino,
          x.Localidade
        ].join(' ').toLowerCase().includes(q);

    })
    .slice()
    .reverse();

  $('reservationList').innerHTML = rows.length

    ? `
      <div class="table-wrap">
      <table>

        <thead>
          <tr>
            <th>Reserva</th>
            <th>Cliente / Artigo</th>
            <th>Qtd.</th>
            <th>Destino / Responsável</th>
            <th>Estado</th>
            <th>Data prevista</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody>

          ${rows.map(function(x){

            return `
            <tr>

              <td>
                ${esc(String(x.ID).slice(0,8))}
                <br>
                <span class="muted">${fmtDate(x.DataReserva)}</span>
              </td>

              <td>
                <b>${esc(x.ClienteNome)}</b>
                <br>
                ${esc(x.ItemNome)}
                <br>
                <span class="muted">
                  ${esc(x.Origem)} · ${esc(x.TipoArtigo)}
                </span>
              </td>

              <td>${esc(x.Quantidade)}</td>

              <td>
                ${esc(x.Destino || '—')}
                <br>
                ${esc(x.Localidade || '')}
                <br>
                <span class="muted">
                  ${esc(x.Responsavel || '')}
                </span>
              </td>

              <td>
                <span class="pill ${
                  x.Estado === 'Pendente'
                    ? 'warn'
                    : x.Estado === 'Entregue'
                      ? 'ok'
                      : 'gray'
                }">
                  ${esc(x.Estado)}
                </span>
              </td>

              <td>${fmtDate(x.DataPrevista)}</td>

              <td>
                ${
                  x.Estado === 'Pendente'
                    ? `
                      <button
                        class="btn"
                        onclick="reservationAction('${esc(x.ID)}','deliverReservation')"
                      >
                        Entregue
                      </button>

                      <button
                        class="btn danger"
                        onclick="reservationAction('${esc(x.ID)}','cancelReservation')"
                      >
                        Cancelar
                      </button>
                    `
                    : '—'
                }
              </td>

            </tr>
            `;

          }).join('')}

        </tbody>
      </table>
      </div>
    `

    : '<div class="empty">Ainda não existem reservas.</div>';

}


/* =================================
   CLIENTES
================================= */

function renderClients(){

  const q = $('clientSearch').value.toLowerCase();

  const rows = db.clientes.filter(function(x){

    return isActive(x.Ativo) &&
      [x.Nome,x.NIF,x.Contacto,x.Email]
        .join(' ')
        .toLowerCase()
        .includes(q);

  });

  $('clientList').innerHTML = rows.length

    ? rows.map(function(x){

      return `
      <article class="card">

        <h3>${esc(x.Nome)}</h3>

        <div class="muted">
          NIF: ${esc(x.NIF || '—')}
        </div>

        <p>
          ${esc(x.Contacto || '—')}
          <br>
          ${esc(x.Email || '')}
          <br>
          ${esc(x.Morada || '')}
        </p>

        <div class="actions">

          <button
            class="btn danger"
            onclick="archiveClient('${esc(x.ID)}')"
          >
            Arquivar
          </button>

        </div>

      </article>
      `;

    }).join('')

    : '<div class="empty">Ainda não existem clientes.</div>';

}


/* =================================
   HISTÓRICO
================================= */

function renderHistory(){

  const rows = db.historico || [];

  $('historyList').innerHTML = rows.length

    ? `
      <div class="table-wrap">
      <table>

        <thead>
          <tr>
            <th>Data</th>
            <th>Ação</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Utilizador</th>
          </tr>
        </thead>

        <tbody>

          ${rows.map(function(x){

            return `
            <tr>
              <td>${fmtDate(x.DataHora)}</td>
              <td>${esc(x.Acao)}</td>
              <td>${esc(x.Descricao)}</td>
              <td>${esc(x.Quantidade)}</td>
              <td>${esc(x.Utilizador || '')}</td>
            </tr>
            `;

          }).join('')}

        </tbody>

      </table>
      </div>
    `

    : '<div class="empty">Sem movimentos registados.</div>';

}


/* =================================
   ATUALIZAÇÃO LOCAL
================================= */

function localApply(p){

  const stamp = new Date().toISOString();

  switch(p.action){

    case 'addItem':

      db.stock.push({
        ID:p.id,
        Nome:p.nome,
        Categoria:p.categoria || 'Outros',
        Tipo:p.tipo || 'Equipamento',
        Stock:Number(p.stock) || 0,
        Demo:Number(p.demo) || 0,
        Ativo:true,
        Min:0,
        CriadoEm:stamp,
        AtualizadoEm:stamp
      });

      break;


    case 'addClient':

      db.clientes.push({
        ID:p.id,
        Nome:p.nome,
        NIF:p.nif || '',
        Contacto:p.contacto || '',
        Email:p.email || '',
        Morada:p.morada || '',
        Observacoes:p.observacoes || '',
        Ativo:true,
        CriadoEm:stamp,
        AtualizadoEm:stamp
      });

      break;


    case 'setItemQty': {

      const item = db.stock.find(
        x => String(x.ID) === String(p.id)
      );

      if(!item) throw Error('Artigo não encontrado.');

      const field = p.field === 'demo' ? 'Demo' : 'Stock';

      item[field] = Number(p.value);
      item.AtualizadoEm = stamp;

      break;
    }


    case 'deleteItem':
    case 'deleteClient': {

      const array = p.action === 'deleteItem'
        ? db.stock
        : db.clientes;

      const item = array.find(
        x => String(x.ID) === String(p.id)
      );

      if(!item) throw Error('Registo não encontrado.');

      item.Ativo = false;

      break;
    }


    case 'createReservation': {

      const item = db.stock.find(
        x => String(x.ID) === String(p.itemId) && isActive(x.Ativo)
      );

      const client = db.clientes.find(
        x => String(x.ID) === String(p.clienteId) && isActive(x.Ativo)
      );

      if(!item || !client){
        throw Error('Seleciona um artigo e um cliente válidos.');
      }

      const field = p.origem === 'Demo' ? 'Demo' : 'Stock';
      const amount = Number(p.quantidade);

      if(!Number.isInteger(amount) || amount < 1){
        throw Error('Quantidade inválida.');
      }

      if(Number(item[field] || 0) < amount){
        throw Error('Quantidade insuficiente. Disponível: ' + item[field]);
      }

      item[field] -= amount;

      db.reservados.push({
        ID:p.id,
        DataReserva:stamp,
        DataPrevista:p.dataPrevista || '',
        ClienteID:client.ID,
        ClienteNome:client.Nome,
        ItemID:item.ID,
        ItemNome:item.Nome,
        Categoria:item.Categoria,
        TipoArtigo:item.Tipo,
        Origem:field,
        Quantidade:amount,
        Estado:'Pendente',
        Destino:p.destino || '',
        Localidade:p.localidade || '',
        Observacoes:p.observacoes || '',
        Responsavel:p.responsavel || '',
        CriadoEm:stamp,
        AtualizadoEm:stamp
      });

      break;
    }


    case 'deliverReservation':
    case 'cancelReservation': {

      const reservation = db.reservados.find(
        x => String(x.ID) === String(p.id)
      );

      if(!reservation || reservation.Estado !== 'Pendente'){
        throw Error('Apenas reservas pendentes podem ser alteradas.');
      }

      reservation.Estado =
        p.action === 'deliverReservation'
          ? 'Entregue'
          : 'Cancelada';

      if(reservation.Estado === 'Cancelada'){

        const item = db.stock.find(
          x => String(x.ID) === String(reservation.ItemID)
        );

        if(item){

          const field = reservation.Origem === 'Demo'
            ? 'Demo'
            : 'Stock';

          item[field] =
            Number(item[field] || 0) +
            Number(reservation.Quantidade || 0);

        }
      }

      break;
    }

  }

}


/* =================================
   FILA DE ALTERAÇÕES
================================= */

function queue(p){

  if(
    ['addItem','addClient','createReservation'].includes(p.action)
  ){
    p.id = p.id || makeId();
  }

  p._opId = makeId();

  localApply(p);

  pending.push(p);

  saveLocal();
  renderAll();

  msg(
    'Alteração guardada. Clica em «Sincronizar agora» para a enviar à Google Sheets.'
  );

}


/* =================================
   ALTERAR QUANTIDADES
================================= */

function setQty(id,field,value){

  const number = Number(value);

  if(!Number.isInteger(number) || number < 0){
    alert('Introduz uma quantidade inteira igual ou superior a zero.');
    renderStock();
    return;
  }

  try{

    queue({
      action:'setItemQty',
      id:id,
      field:field,
      value:number
    });

  }catch(error){

    alert(error.message);
    renderStock();

  }

}

/* =================================
   JSONP - COMUNICAÇÃO COM APPS SCRIPT
================================= */

function jsonp(url,timeoutMs=25000){

  return new Promise(function(resolve,reject){

    const callback =
      '__i3o_cb_' + makeId().replace(/[^A-Za-z0-9_]/g,'');

    const script = document.createElement('script');

    let done = false;

    const timer = setTimeout(function(){

      finish(
        new Error(
          'Tempo de ligação esgotado. Verifica a implementação e a ligação à Internet.'
        )
      );

    },timeoutMs);


    function finish(error,data){

      if(done) return;

      done = true;

      clearTimeout(timer);

      delete window[callback];

      script.remove();

      if(error){
        reject(error);
      }else{
        resolve(data);
      }

    }


    window[callback] = function(data){
      finish(null,data);
    };

    script.onerror = function(){
      finish(
        new Error(
          'Não foi possível contactar a aplicação Google Apps Script.'
        )
      );
    };

    script.src =
      url +
      (url.includes('?') ? '&' : '?') +
      'callback=' + callback +
      '&_=' + Date.now();

    document.body.appendChild(script);

  });

}


/* =================================
   CARREGAR DADOS DA GOOGLE SHEETS
================================= */

async function loadFromServer(){

  if(busy) return;

  busy = true;
  updateBadge();

  try{

    msg('A carregar dados da Google Sheets...');

    const response = await jsonp(SCRIPT_URL);

    if(!response || response.ok !== true || !response.data){

      throw Error(
        response && response.error
          ? response.error
          : 'Resposta inválida da Google Sheets.'
      );

    }

    if(pending.length){

      msg(
        'Dados recebidos. Existem alterações locais por sincronizar. Sincroniza primeiro.'
      );

      return;
    }

    db = response.data;

    saveLocal();
    renderAll();

    msg('Dados carregados com sucesso da Google Sheets.');

  }catch(error){

    msg('Erro ao carregar: ' + error.message);

  }finally{

    busy = false;
    updateBadge();

  }

}


/* =================================
   SINCRONIZAÇÃO MANUAL
================================= */

async function syncNow(){

  if(busy) return;

  busy = true;
  updateBadge();

  try{

    while(pending.length){

      const operation = pending[0];

      msg(
        'A sincronizar alteração. ' +
        pending.length +
        ' pendente(s)...'
      );

      const url =
        SCRIPT_URL +
        '?action=mutate&payload=' +
        encodeURIComponent(JSON.stringify(operation));

      const response = await jsonp(url,30000);

      if(!response || response.ok !== true){

        throw Error(
          response && response.error
            ? response.error
            : 'O servidor não confirmou a alteração.'
        );

      }

      pending.shift();

      saveLocal();

    }


    msg('A atualizar os dados da Google Sheets...');

    const response = await jsonp(SCRIPT_URL);

    if(!response || response.ok !== true || !response.data){

      throw Error(
        response && response.error
          ? response.error
          : 'Não foi possível atualizar os dados.'
      );

    }

    db = response.data;

    saveLocal();
    renderAll();

    msg(
      'Sincronização concluída. Todos os dados estão atualizados.'
    );

  }catch(error){

    msg(
      'Erro na sincronização: ' +
      error.message +
      ' As alterações ainda não confirmadas continuam guardadas neste navegador.'
    );

  }finally{

    busy = false;
    updateBadge();

  }

}

/* =================================
   GUARDAR FORMULÁRIOS
================================= */

function submitModal(event){

  event.preventDefault();

  const formData = Object.fromEntries(
    new FormData(event.target).entries()
  );

  try{

    if(modalMode === 'item'){

      formData.action = 'addItem';
      formData.stock = Number(formData.stock);
      formData.demo = Number(formData.demo);

    }


    if(modalMode === 'client'){

      formData.action = 'addClient';

    }


    if(modalMode === 'reservation'){

      if(!formData.clienteId){
        throw Error('Cria primeiro um cliente.');
      }

      if(!formData.itemId){
        throw Error('Cria primeiro um artigo.');
      }

      formData.action = 'createReservation';
      formData.quantidade = Number(formData.quantidade);

    }


    queue(formData);

    closeModal();

  }catch(error){

    alert(error.message);

  }

}
